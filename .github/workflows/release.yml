name: Release

# Đẩy tag dạng v2.1.0 → build, kiểm thử, publish ScheduleApp.exe + bộ cài + version.json lên GitHub Releases.
# ScheduleApp có nguồn cập nhật "github:<chủ>/<repo>" sẽ tự báo có bản mới.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ScheduleApp.slnx -c Release --nologo

      # Chưa ký số exe / bộ cài: máy khách chỉ kiểm SHA-256 + phiên bản. Khi bắt đầu ký (signtool sau bước Publish, trước khi tính SHA-256),
      # phải ký mọi bản về sau bằng chứng chỉ cùng Subject — bản đã ký sẽ từ chối bản mới chưa ký hoặc ký bởi người khác (gia hạn chứng chỉ thì được).
      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish ScheduleApp.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$version -o publish --nologo
          $sha = (Get-FileHash publish/ScheduleApp.exe -Algorithm SHA256).Hash
          $manifest = [ordered]@{ version = $version; url = 'ScheduleApp.exe'; notes = ''; sha256 = $sha }
          [IO.File]::WriteAllText("$PWD/publish/version.json", ($manifest | ConvertTo-Json), (New-Object System.Text.UTF8Encoding $false))
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer/ScheduleApp.iss

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ScheduleApp ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            publish/ScheduleApp.exe
            publish/version.json
            publish/ScheduleApp-Setup-*.exe
